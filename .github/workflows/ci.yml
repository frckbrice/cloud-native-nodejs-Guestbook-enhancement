################################################################################
# CI/CD Pipeline Configuration
#
# Motivation:
# The original project had no automated testing or deployment. This addresses
# the enhancement request from PROJECT_OVERVIEW.md: "Setting up CI/CD pipelines".
#
# Approach:
# - GitHub Actions for continuous integration
# - Automated testing on pull requests and pushes
# - Code quality checks (linting)
# - Build verification
# - Optional deployment automation
#
# Benefits:
# - Automated quality assurance
# - Early detection of issues
# - Consistent build process
# - Reduced manual deployment errors
# - Faster feedback loop for developers
#
# Workflow:
# - Runs on push to main and pull requests
# - Installs dependencies
# - Runs linting
# - Builds Docker images (if configured)
# - Runs tests (when available)
################################################################################
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run ESLint
        run: npm run lint

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install backend dependencies
        working-directory: ./src/backend
        run: npm install
      
      - name: Verify backend build
        working-directory: ./src/backend
        run: node -c app.js

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm install
      
      - name: Verify frontend build
        working-directory: ./src/frontend
        run: node -c app.js

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, build-backend, build-frontend]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: false
          tags: nodejs-guestbook-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: false
          tags: nodejs-guestbook-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

