################################################################################
# MongoDB StatefulSet with persistent storage
# This replaces the Deployment for production-ready persistent storage
################################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nodejs-guestbook-mongodb
  labels:
    app: nodejs-guestbook
    tier: db
spec:
  serviceName: nodejs-guestbook-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-guestbook
      tier: db
  template:
    metadata:
      labels:
        app: nodejs-guestbook
        tier: db
    spec:
      containers:
      - name: mongo
        image: mongo:4
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "mongo --eval 'db.adminCommand(\"ping\")'"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "mongo --eval 'db.adminCommand(\"ping\")'"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

